<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StupidChat</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 1. KaTeX 核心排版引擎样式与脚本 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- 2. markdown-it-texmath 工业级数学定界符插件 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/markdown-it-texmath@1.0.0/css/texmath.min.css">
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-texmath@1.0.0/texmath.min.js"></script>

    <!-- 3. markdown-it CommonMark 工业级解析引擎 -->
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>

    <!-- 4. Highlight.js 代码高亮 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#f5f7fb',
                            card: '#ffffff',
                            border: '#dfe5ef',
                            hover: '#eef2f8',
                            primary: '#2563eb'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        body { color: #1e293b; }
        header, footer, #memoryPanel { box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05); }
        #chatBox { max-width: 90rem; }
        footer > div { max-width: 90rem !important; }
        .markdown-body { color: #1e293b !important; line-height: 1.75; }
        .markdown-body a { color: #2563eb; }

        /* Markdown 正文排版 */
        .markdown-body pre {
            position: relative;
            background-color: #172033 !important;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 0.75rem 0;
            border: 1px solid #cbd5e1;
        }
        .markdown-body code {
            font-family: ui-monospace, Menlo, Monaco, Consolas, monospace;
            font-size: 0.85rem;
        }
        .markdown-body :not(pre) > code {
            background-color: #eff3f8;
            padding: 0.15rem 0.35rem;
            border-radius: 0.25rem;
            color: #1e3a5f;
        }
        .markdown-body p { margin-bottom: 0.6rem; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.5rem; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.25rem; margin-bottom: 0.5rem; }
        .markdown-body blockquote {
            border-left: 3px solid #6366f1;
            padding-left: 0.75rem;
            color: #475569;
            margin: 0.6rem 0;
        }
        .markdown-body table { width: 100%; border-collapse: collapse; margin: 0.6rem 0; }
        .markdown-body th, .markdown-body td { border: 1px solid #dbe3ee; padding: 0.45rem 0.7rem; text-align: left; }
        .markdown-body th { background: #f1f5f9; }

        #memoryPanel .text-gray-300, #memoryPanel .text-gray-200 { color: #334155 !important; }
        #memoryPanel .text-gray-400, #memoryPanel .text-gray-500 { color: #64748b !important; }
        #memoryPanel .text-indigo-200 { color: #ffffff !important; }
        #settingsModal .text-gray-100, #settingsModal .text-gray-200, #settingsModal .text-gray-300 { color: #1e293b !important; }
        #settingsModal .text-gray-400 { color: #64748b !important; }
        #settingsModal input, #settingsModal textarea { color: #0f172a !important; }
        @media (min-width: 900px) {
            #chatBox { width: calc(100% - 20rem); max-width: none; margin-left: 20rem; margin-right: 0; }
            footer { padding-left: 20rem; }
        }
        @media (max-width: 640px) {
            header { padding-left: 0.75rem !important; padding-right: 0.75rem !important; }
            header .gap-3 { gap: 0.4rem; }
            #chatBox { padding: 1rem; }
            footer > div { padding-left: 0.75rem !important; padding-right: 0.75rem !important; }
            #memoryPanel { top: 3.5rem; }
        }

        /* KaTeX 公式自适应增强 */
        .katex-display {
            overflow-x: auto;
            overflow-y: hidden;
            padding: 0.4rem 0;
            margin: 0.8rem 0 !important;
        }
    </style>
</head>
<body class="bg-brand-bg text-slate-700 h-screen flex flex-col font-sans overflow-hidden select-none">

    <!-- 顶部状态栏 -->
    <header class="h-14 border-b border-brand-border bg-brand-card/80 backdrop-blur px-5 flex items-center justify-between z-20 flex-shrink-0">
        <div class="flex items-center gap-3">
            <span class="text-base font-black tracking-wider text-indigo-400 font-mono">StupidChat</span>
            <span id="badgeModel" class="text-xs px-2 py-0.5 rounded bg-brand-border/60 text-gray-400 font-mono max-w-[140px] truncate">
                未设置模型
            </span>
            <span id="badgeHost" class="text-[11px] text-gray-500 font-mono hidden md:inline truncate max-w-xs">
                (无 API 接口)
            </span>
        </div>
        <div class="flex items-center gap-2">
            <button id="newChatBtn" title="新建对话" class="p-1.5 text-gray-400 hover:text-indigo-300 hover:bg-brand-hover rounded-lg transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            </button>
            <button id="memoryPanelBtn" title="会话列表" class="p-1.5 text-gray-400 hover:text-indigo-300 hover:bg-brand-hover rounded-lg transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 3v12a3 3 0 003 3h9M6 3h3m-3 0a3 3 0 00-3 3m15 12h-3m3 0a3 3 0 003-3V9a3 3 0 00-3-3H9a3 3 0 00-3 3"/></svg>
            </button>
            <button id="exportMemoryBtn" title="导出记忆" class="p-1.5 text-gray-400 hover:text-indigo-300 hover:bg-brand-hover rounded-lg transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 16v-8m0 8l-3-3m3 3l3-3M4 20h16"/></svg>
            </button>
            <button id="importMemoryBtn" title="导入记忆" class="p-1.5 text-gray-400 hover:text-indigo-300 hover:bg-brand-hover rounded-lg transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v8m0-8l-3 3m3-3l3 3M4 20h16"/></svg>
            </button>
            <input id="importMemoryInput" type="file" accept="application/json,.json" class="hidden">
            <button id="clearBtn" title="删除当前对话" class="p-1.5 text-gray-400 hover:text-red-400 hover:bg-brand-hover rounded-lg transition text-xs flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                <span class="hidden sm:inline">清空</span>
            </button>
            <button id="openSettingsBtn" class="px-3 py-1.5 bg-indigo-600/20 text-indigo-400 hover:bg-indigo-600/30 border border-indigo-500/30 rounded-lg text-xs font-mono font-medium flex items-center gap-1.5 transition">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                配置 API
            </button>
        </div>
    </header>

    <aside id="memoryPanel" class="hidden lg:flex fixed z-30 top-14 left-0 bottom-0 w-80 max-w-[86vw] border-r border-brand-border bg-brand-card shadow-2xl flex-col">
        <div class="flex items-center justify-between px-4 py-3 border-b border-brand-border">
            <span class="text-xs font-mono text-gray-700">会话列表</span>
            <button id="closeMemoryPanelBtn" title="关闭" class="p-1 text-gray-400 hover:text-gray-200">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="px-4 pt-3 text-[11px] font-mono text-slate-400">会话列表</div>
        <div id="sessionList" class="p-3 overflow-y-auto"></div>
    </aside>

    <!-- 消息对话区域 -->
    <main id="chatBox" class="flex-1 overflow-y-auto px-5 py-7 w-full mx-auto space-y-6 select-text">
        <div id="welcomeScreen" class="h-full flex flex-col items-center justify-center text-center py-20 text-slate-500">
            <h2 class="text-xl font-bold font-mono text-slate-800 mb-2">StupidChat</h2>
            <button onclick="document.getElementById('openSettingsBtn').click()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-medium transition shadow-lg shadow-indigo-600/20">
                立即前往配置 API
            </button>
        </div>
    </main>

    <!-- 底部控制区 -->
    <footer class="border-t border-brand-border bg-brand-card/90 backdrop-blur flex-shrink-0">
        <div class="mx-auto px-5 pt-2 pb-3 space-y-2">
            
            <!-- 极简 Token 统计 -->
            <div class="flex items-center justify-between text-[11px] font-mono px-1 text-gray-500">
                <div class="flex items-center gap-3">
                    <span>Tokens:</span>
                    <span>Prompt: <b id="statPrompt" class="text-slate-700">0</b></span>
                    <span>Output: <b id="statCompletion" class="text-slate-700">0</b></span>
                    <span>Total: <b id="statTotal" class="text-indigo-400">0</b></span>
                </div>
                <div class="text-[10px] text-slate-400 hidden sm:block">当前会话完整上下文</div>
            </div>

            <!-- 待发送附件托盘 -->
            <div id="attachmentTray" class="hidden flex flex-wrap gap-2 pt-1 pb-0.5"></div>

            <!-- 输入控制器 -->
            <div class="relative flex items-end bg-brand-bg rounded-xl border border-brand-border focus-within:border-indigo-500 transition-all p-1.5 gap-1.5">
                
                <button id="uploadTriggerBtn" title="上传代码/文档/图片 (支持拖拽/截图粘贴)" class="p-2 text-gray-400 hover:text-indigo-400 hover:bg-brand-hover rounded-lg transition mb-0.5 flex-shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/></svg>
                </button>
                <input type="file" id="hiddenFileInput" multiple class="hidden">

                <textarea 
                    id="userInput" 
                    rows="1" 
                    placeholder="输入问题或说明... (Enter 发送，Shift+Enter 换行，可直接粘贴图片/拖拽文件)" 
                    class="w-full bg-transparent text-sm text-slate-900 placeholder-slate-400 px-2 py-2 focus:outline-none resize-none max-h-40 leading-relaxed font-sans"
                ></textarea>

                <div class="flex items-center gap-1.5 mb-1 mr-0.5 flex-shrink-0">
                    <button id="stopBtn" class="hidden px-2.5 py-1.5 rounded-lg bg-red-950/60 border border-red-800 text-red-300 text-xs font-mono hover:bg-red-900/60 transition">
                        停止
                    </button>
                    <button id="sendBtn" class="p-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white transition disabled:opacity-30 disabled:cursor-not-allowed">
                        <svg class="w-4 h-4 transform rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </footer>

    <!-- 自定义 API 配置弹窗 (无预设) -->
    <div id="settingsModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-brand-card border border-brand-border rounded-xl max-w-md w-full p-5 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-brand-border pb-3">
                <h3 class="font-bold text-sm text-gray-100 font-mono">自定义 API 接口配置</h3>
                <button id="closeSettingsBtn" class="text-gray-400 hover:text-gray-200">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-gray-300 font-medium mb-1">API Base URL <span class="text-red-400">*</span></label>
                    <input id="settingUrl" type="text" placeholder="例如: https://api.deepseek.com/v1" class="w-full bg-brand-bg border border-brand-border rounded px-3 py-2 text-gray-200 focus:outline-none focus:border-indigo-500 font-mono">
                </div>

                <div>
                    <label class="block text-gray-300 font-medium mb-1">API Key</label>
                    <input id="settingKey" type="password" placeholder="sk-..." class="w-full bg-brand-bg border border-brand-border rounded px-3 py-2 text-gray-200 focus:outline-none focus:border-indigo-500 font-mono">
                </div>

                <div>
                    <label class="block text-gray-300 font-medium mb-1">模型名称 (Model) <span class="text-red-400">*</span></label>
                    <input id="settingModel" type="text" placeholder="例如: deepseek-chat 或 gpt-4o" class="w-full bg-brand-bg border border-brand-border rounded px-3 py-2 text-gray-200 focus:outline-none focus:border-indigo-500 font-mono">
                </div>

                <div>
                    <label class="block text-gray-300 font-medium mb-1">System Prompt</label>
                    <textarea id="settingSystem" rows="2" placeholder="系统指令..." class="w-full bg-brand-bg border border-brand-border rounded px-3 py-2 text-gray-200 focus:outline-none focus:border-indigo-500"></textarea>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-gray-300 font-medium">Temperature: <span id="tempValue" class="font-mono text-indigo-400">0.7</span></label>
                    </div>
                    <input id="settingTemp" type="range" min="0" max="2" step="0.1" value="0.7" class="w-full accent-indigo-500 cursor-pointer">
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2 border-t border-brand-border">
                <button id="saveSettingsBtn" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded font-medium text-xs font-mono transition">
                    保存配置
                </button>
            </div>
        </div>
    </div>

    <!-- 逻辑引擎 -->
    <script>
        // ==========================================
        //  工业级解析链：markdown-it + texmath + katex
        // ==========================================
        const md = window.markdownit({
            html: true,
            breaks: true,
            linkify: true,
            highlight: function (str, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try {
                        return '<pre class="hljs"><code>' +
                               hljs.highlight(str, { language: lang, ignoreIllegals: true }).value +
                               '</code></pre>';
                    } catch (__) {}
                }
                return '<pre class="hljs"><code>' + md.utils.escapeHtml(str) + '</code></pre>';
            }
        }).use(window.texmath, {
            engine: window.katex,
            // 完整启用工业级定界符规则：
            // 'dollars':  $...$ (行内) 与 $$...$$ (独占块)
            // 'brackets': \(...\) (行内) 与 \[...\] (独占块) -> 完美兼容 OpenAI / DeepSeek 原生输出
            // 'beg_end':  \begin{equation|aligned|matrix...}...\end{...} 纯环境公式
            delimiters: ['dollars', 'brackets', 'beg_end'],
            katexOptions: {
                throwOnError: false,
                errorColor: "#cc0000"
            }
        });

        const STORAGE_KEY_CONFIG = 'stupidchat_config';
        const STORAGE_KEY_HISTORY = 'stupidchat_history';
        const STORAGE_KEY_WORKSPACE = 'stupidchat_workspace_v1';
        // Browsers commonly cap localStorage at about 5 MB. Leave headroom for
        // settings and other keys so a full history never interrupts a request.
        const HISTORY_STORAGE_LIMIT = 4 * 1024 * 1024;
        const STORED_MESSAGE_CHAR_LIMIT = 48000;

        function readStoredJson(key, fallback) {
            try {
                return JSON.parse(localStorage.getItem(key)) || fallback;
            } catch (error) {
                return fallback;
            }
        }

        let config = readStoredJson(STORAGE_KEY_CONFIG, {
            baseUrl: "",
            apiKey: "",
            model: "",
            systemPrompt: "",
            temperature: 0.7
        });
        let pendingFiles = [];
        let abortController = null;

        function createId() {
            const randomPart = globalThis.crypto?.getRandomValues
                ? crypto.getRandomValues(new Uint32Array(1))[0].toString(36)
                : Math.random().toString(36).slice(2);
            return `${Date.now().toString(36)}-${randomPart}`;
        }

        function createSession(title = '新对话') {
            const now = Date.now();
            return { id: createId(), title, createdAt: now, updatedAt: now, activeNodeId: null, nodes: [] };
        }

        function migrateLegacyHistory() {
            const legacyHistory = readStoredJson(STORAGE_KEY_HISTORY, []);
            const session = createSession(legacyHistory.length ? '已迁移对话' : '新对话');
            let parentId = null;
            legacyHistory.forEach(item => {
                const node = { id: createId(), parentId, role: item.role, content: item.content, createdAt: Date.now() };
                session.nodes.push(node);
                parentId = node.id;
            });
            session.activeNodeId = parentId;
            return { version: 1, activeSessionId: session.id, sessions: [session] };
        }

        function isWorkspace(value) {
            return value && value.version === 1 && Array.isArray(value.sessions) && value.sessions.length > 0;
        }

        let workspace = readStoredJson(STORAGE_KEY_WORKSPACE, null);
        if (!isWorkspace(workspace)) workspace = migrateLegacyHistory();

        function truncateStoredText(text) {
            if (text.length <= STORED_MESSAGE_CHAR_LIMIT) return text;

            const half = Math.floor(STORED_MESSAGE_CHAR_LIMIT / 2);
            return `${text.slice(0, half)}\n\n[内容过长，已在本地历史中截断]\n\n${text.slice(-half)}`;
        }

        function makeStorableContent(content) {
            if (typeof content === 'string') {
                return truncateStoredText(content);
            }

            if (!Array.isArray(content)) return '';

            return content.map(item => {
                if (item.type === 'text') {
                    return { type: 'text', text: truncateStoredText(item.text || '') };
                }

                // Data URLs for images are often several MB and cannot safely be
                // kept in localStorage. They remain available for the current request.
                if (item.type === 'image_url') {
                    return { type: 'text', text: '[图片附件仅在当前会话中可用]' };
                }

                return null;
            }).filter(Boolean);
        }

        function getStorageSize(value) {
            return new Blob([value]).size;
        }

        function getActiveSession() {
            let session = workspace.sessions.find(item => item.id === workspace.activeSessionId);
            if (!session) {
                session = workspace.sessions[0] || createSession();
                if (!workspace.sessions.length) workspace.sessions.push(session);
                workspace.activeSessionId = session.id;
            }
            return session;
        }

        function getNodePath(session, nodeId = session.activeNodeId) {
            const nodeMap = new Map(session.nodes.map(node => [node.id, node]));
            const path = [];
            const visited = new Set();
            let node = nodeMap.get(nodeId);
            while (node && !visited.has(node.id)) {
                path.unshift(node);
                visited.add(node.id);
                node = nodeMap.get(node.parentId);
            }
            return path;
        }

        function addMessageNode(role, content) {
            const session = getActiveSession();
            const node = {
                id: createId(),
                parentId: session.activeNodeId,
                role,
                content,
                createdAt: Date.now()
            };
            session.nodes.push(node);
            session.activeNodeId = node.id;
            session.updatedAt = node.createdAt;
            if (role === 'user' && session.title === '新对话') {
                const titleSource = typeof content === 'string' ? content : content.find(item => item.type === 'text')?.text || '图片对话';
                session.title = titleSource.replace(/\s+/g, ' ').slice(0, 28) || '新对话';
            }
            return node;
        }

        function makeStorableWorkspace() {
            return {
                version: 1,
                activeSessionId: workspace.activeSessionId,
                sessions: workspace.sessions.map(session => ({
                    ...session,
                    nodes: session.nodes.map(({ content, ...node }) => ({ ...node, content: makeStorableContent(content) }))
                }))
            };
        }

        function saveWorkspace() {
            const storableWorkspace = makeStorableWorkspace();
            let serializedWorkspace = JSON.stringify(storableWorkspace);

            while (getStorageSize(serializedWorkspace) > HISTORY_STORAGE_LIMIT && storableWorkspace.sessions.length > 1) {
                const removable = storableWorkspace.sessions
                    .filter(session => session.id !== storableWorkspace.activeSessionId)
                    .sort((a, b) => a.updatedAt - b.updatedAt)[0];
                if (!removable) break;
                storableWorkspace.sessions = storableWorkspace.sessions.filter(session => session.id !== removable.id);
                serializedWorkspace = JSON.stringify(storableWorkspace);
            }

            const activeSession = storableWorkspace.sessions.find(session => session.id === storableWorkspace.activeSessionId);
            while (activeSession && getStorageSize(serializedWorkspace) > HISTORY_STORAGE_LIMIT && activeSession.nodes.length > 1) {
                activeSession.nodes.shift();
                const firstNode = activeSession.nodes[0];
                if (firstNode) firstNode.parentId = null;
                serializedWorkspace = JSON.stringify(storableWorkspace);
            }

            try {
                localStorage.setItem(STORAGE_KEY_WORKSPACE, serializedWorkspace);
                localStorage.removeItem(STORAGE_KEY_HISTORY);
                return true;
            } catch (error) {
                return false;
            }
        }

        // DOM 引用
        const chatBox = document.getElementById('chatBox');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const stopBtn = document.getElementById('stopBtn');
        const clearBtn = document.getElementById('clearBtn');
        const newChatBtn = document.getElementById('newChatBtn');
        const memoryPanelBtn = document.getElementById('memoryPanelBtn');
        const closeMemoryPanelBtn = document.getElementById('closeMemoryPanelBtn');
        const memoryPanel = document.getElementById('memoryPanel');
        const sessionList = document.getElementById('sessionList');
        const exportMemoryBtn = document.getElementById('exportMemoryBtn');
        const importMemoryBtn = document.getElementById('importMemoryBtn');
        const importMemoryInput = document.getElementById('importMemoryInput');
        const badgeModel = document.getElementById('badgeModel');
        const badgeHost = document.getElementById('badgeHost');
        const uploadTriggerBtn = document.getElementById('uploadTriggerBtn');
        const hiddenFileInput = document.getElementById('hiddenFileInput');
        const attachmentTray = document.getElementById('attachmentTray');

        // Token 计数
        const statPrompt = document.getElementById('statPrompt');
        const statCompletion = document.getElementById('statCompletion');
        const statTotal = document.getElementById('statTotal');

        // 设置弹窗
        const settingsModal = document.getElementById('settingsModal');
        const openSettingsBtn = document.getElementById('openSettingsBtn');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const settingUrl = document.getElementById('settingUrl');
        const settingKey = document.getElementById('settingKey');
        const settingModel = document.getElementById('settingModel');
        const settingSystem = document.getElementById('settingSystem');
        const settingTemp = document.getElementById('settingTemp');
        const tempValue = document.getElementById('tempValue');

        function init() {
            updateBadges();
            renderActiveConversation();
            renderMemoryPanel();
            setupTextarea();
            setupFileHandlers();

            if (!config.baseUrl || !config.model) {
                setTimeout(() => openSettingsModal(), 300);
            }
        }

        function updateBadges() {
            badgeModel.textContent = config.model || '未设置模型';
            badgeHost.textContent = config.baseUrl ? `(${config.baseUrl})` : '(无 API 接口)';
        }

        // 纯净调用工业级解析库，无任何手写正则
        function renderContentToElement(rawText, container) {
            container.innerHTML = md.render(rawText);
            attachCodeCopyButtons(container);
        }

        function attachCodeCopyButtons(container) {
            container.querySelectorAll('pre').forEach(pre => {
                if (pre.querySelector('.copy-code-btn')) return;
                const btn = document.createElement('button');
                btn.className = 'copy-code-btn absolute top-2 right-2 text-[10px] px-2 py-0.5 bg-brand-card hover:bg-gray-700 text-gray-400 hover:text-gray-200 rounded border border-brand-border transition font-mono select-none';
                btn.textContent = '复制';
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const code = pre.querySelector('code')?.innerText || pre.innerText;
                    navigator.clipboard.writeText(code).then(() => {
                        btn.textContent = '已复制!';
                        setTimeout(() => btn.textContent = '复制', 2000);
                    });
                };
                pre.appendChild(btn);
            });
        }

        // --- 渲染消息气泡 ---
        function appendMessage(role, contentData, nodeId = null) {
            welcomeScreen.style.display = 'none';
            const row = document.createElement('div');
            const isUser = role === 'user';
            row.className = `flex text-sm ${isUser ? 'justify-end' : 'justify-start'}`;

            const bubble = document.createElement('div');
            bubble.className = `${isUser ? 'max-w-[72%]' : 'w-full max-w-[96%]'} rounded-lg px-4 py-3 ${
                isUser 
                ? 'bg-indigo-600 text-white whitespace-pre-wrap' 
                : 'bg-brand-card border border-brand-border shadow-sm markdown-body overflow-x-auto'
            }`;

            if (isUser) {
                if (typeof contentData === 'string') {
                    bubble.textContent = contentData;
                } else if (Array.isArray(contentData)) {
                    contentData.forEach(item => {
                        if (item.type === 'text') {
                            const p = document.createElement('div');
                            p.textContent = item.text;
                            bubble.appendChild(p);
                        } else if (item.type === 'image_url') {
                            const img = document.createElement('img');
                            img.src = item.image_url.url;
                            img.className = 'max-w-xs rounded border border-indigo-400/40 my-1';
                            bubble.appendChild(img);
                        }
                    });
                }
                row.appendChild(bubble);
            } else {
                if (contentData) {
                    renderContentToElement(contentData, bubble);
                } else {
                    bubble.innerHTML = '<span class="inline-block animate-pulse">▍</span>';
                }
                row.appendChild(bubble);
            }

            chatBox.appendChild(row);
            scrollToBottom();
            return bubble;
        }

        function scrollToBottom() {
            chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
        }

        function renderActiveConversation() {
            const session = getActiveSession();
            chatBox.innerHTML = '';
            chatBox.appendChild(welcomeScreen);
            const path = getNodePath(session);
            if (!path.length) {
                welcomeScreen.style.display = 'flex';
                return;
            }
            welcomeScreen.style.display = 'none';
            path.forEach(node => appendMessage(node.role, node.content, node.id));
        }

        function renderMemoryPanel() {
            const activeSession = getActiveSession();
            sessionList.innerHTML = '';
            [...workspace.sessions].sort((a, b) => b.updatedAt - a.updatedAt).forEach(session => {
                const button = document.createElement('button');
                button.className = `w-full text-left px-3 py-2 rounded text-xs mb-1 truncate ${session.id === activeSession.id ? 'bg-indigo-600 text-white shadow-sm' : 'text-gray-500 hover:bg-brand-hover hover:text-slate-800'}`;
                button.textContent = session.title || '未命名对话';
                button.title = session.title || '未命名对话';
                button.onclick = () => {
                    workspace.activeSessionId = session.id;
                    saveWorkspace();
                    renderActiveConversation();
                    renderMemoryPanel();
                    if (window.matchMedia('(max-width: 899px)').matches) {
                        memoryPanel.classList.add('hidden');
                        memoryPanel.classList.remove('flex');
                    }
                };
                sessionList.appendChild(button);
            });
        }

        // --- 文件/图片处理 ---
        function setupFileHandlers() {
            uploadTriggerBtn.addEventListener('click', () => hiddenFileInput.click());
            hiddenFileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    handleSelectedFiles(e.target.files);
                    hiddenFileInput.value = '';
                }
            });

            window.addEventListener('dragover', (e) => e.preventDefault());
            window.addEventListener('drop', (e) => {
                e.preventDefault();
                if (e.dataTransfer && e.dataTransfer.files.length > 0) {
                    handleSelectedFiles(e.dataTransfer.files);
                }
            });

            userInput.addEventListener('paste', (e) => {
                const items = (e.clipboardData || window.clipboardData).items;
                const files = [];
                for (let i = 0; i < items.length; i++) {
                    if (items[i].kind === 'file') {
                        files.push(items[i].getAsFile());
                    }
                }
                if (files.length > 0) {
                    handleSelectedFiles(files);
                }
            });
        }

        async function handleSelectedFiles(files) {
            for (const file of files) {
                const isImage = file.type.startsWith('image/');
                const ext = file.name.split('.').pop().toLowerCase();

                if (isImage) {
                    const dataUrl = await readFileAsDataURL(file);
                    pendingFiles.push({ name: file.name, size: file.size, isImage: true, data: dataUrl, ext });
                } else {
                    const text = await readFileAsText(file);
                    pendingFiles.push({ name: file.name, size: file.size, isImage: false, data: text, ext });
                }
            }
            renderAttachmentTray();
        }

        function readFileAsText(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsText(file);
            });
        }

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function renderAttachmentTray() {
            if (pendingFiles.length === 0) {
                attachmentTray.classList.add('hidden');
                attachmentTray.innerHTML = '';
                return;
            }
            attachmentTray.classList.remove('hidden');
            attachmentTray.innerHTML = '';

            pendingFiles.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'flex items-center gap-1.5 bg-slate-100 border border-slate-200 text-xs px-2 py-1 rounded-md text-slate-600 font-mono';
                
                const icon = file.isImage ? '🖼️' : '📄';
                const sizeStr = (file.size / 1024).toFixed(1) + 'KB';
                item.innerHTML = `
                    <span>${icon}</span>
                    <span class="max-w-[120px] truncate" title="${file.name}">${file.name}</span>
                    <span class="text-[10px] text-gray-500">(${sizeStr})</span>
                    <button class="text-gray-400 hover:text-red-400 ml-1 font-bold">✕</button>
                `;
                item.querySelector('button').onclick = () => {
                    pendingFiles.splice(index, 1);
                    renderAttachmentTray();
                };
                attachmentTray.appendChild(item);
            });
        }

        // --- 核心网络交互 ---
        async function handleSend() {
            const query = userInput.value.trim();
            if (!query && pendingFiles.length === 0) return;

            if (!config.baseUrl || !config.model) {
                alert('请先配置 API Base URL 与模型名称！');
                openSettingsModal();
                return;
            }

            let textPayload = "";
            const textFiles = pendingFiles.filter(f => !f.isImage);
            const imageFiles = pendingFiles.filter(f => f.isImage);

            if (textFiles.length > 0) {
                textPayload += "【附件内容如下】:\n";
                textFiles.forEach(f => {
                    textPayload += `\n--- 文件: ${f.name} ---\n\`\`\`${f.ext}\n${f.data}\n\`\`\`\n`;
                });
                textPayload += "\n【提问】:\n";
            }
            textPayload += query || (textFiles.length > 0 || imageFiles.length > 0 ? "请分析上述附件/图片内容。" : "");

            let userContentForApi;
            if (imageFiles.length > 0) {
                userContentForApi = [{ type: "text", text: textPayload }];
                imageFiles.forEach(img => {
                    userContentForApi.push({
                        type: "image_url",
                        image_url: { url: img.data }
                    });
                });
            } else {
                userContentForApi = textPayload;
            }

            const userNode = addMessageNode('user', userContentForApi);
            appendMessage('user', userContentForApi, userNode.id);
            saveWorkspace();
            renderMemoryPanel();

            userInput.value = '';
            pendingFiles = [];
            renderAttachmentTray();
            adjustTextarea(userInput);

            setGeneratingState(true);
            const aiBubble = appendMessage('assistant', '');

            const requestMessages = [];
            if (config.systemPrompt) {
                requestMessages.push({ role: 'system', content: config.systemPrompt });
            }
            const conversationPath = getNodePath(getActiveSession());
            requestMessages.push(...conversationPath.map(({ role, content }) => ({ role, content })));

            abortController = new AbortController();
            let accumulatedContent = "";

            try {
                const response = await fetch(`${config.baseUrl}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${config.apiKey || ''}`
                    },
                    body: JSON.stringify({
                        model: config.model,
                        messages: requestMessages,
                        temperature: config.temperature,
                        stream: true,
                        stream_options: { include_usage: true }
                    }),
                    signal: abortController.signal
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`[HTTP ${response.status}] ${errorText}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed || trimmed.startsWith(':') || trimmed === 'data: [DONE]') continue;

                        if (trimmed.startsWith('data: ')) {
                            try {
                                const parsed = JSON.parse(trimmed.slice(6));
                                const delta = parsed.choices?.[0]?.delta?.content || "";
                                if (delta) {
                                    accumulatedContent += delta;
                                    // 工业级原生流式渲染
                                    renderContentToElement(accumulatedContent, aiBubble);
                                    scrollToBottom();
                                }
                                if (parsed.usage) {
                                    statPrompt.textContent = parsed.usage.prompt_tokens || 0;
                                    statCompletion.textContent = parsed.usage.completion_tokens || 0;
                                    statTotal.textContent = parsed.usage.total_tokens || 0;
                                }
                            } catch (e) {}
                        }
                    }
                }

                renderContentToElement(accumulatedContent, aiBubble);
                addMessageNode('assistant', accumulatedContent);
                saveWorkspace();
                renderMemoryPanel();

            } catch (err) {
                if (err.name === 'AbortError') {
                    if (accumulatedContent) {
                        renderContentToElement(accumulatedContent + '\n\n*(已手动停止)*', aiBubble);
                        addMessageNode('assistant', accumulatedContent);
                        saveWorkspace();
                        renderMemoryPanel();
                    }
                } else {
                    aiBubble.innerHTML = `<span class="text-red-400 font-mono text-xs">请求失败: ${err.message}</span>`;
                }
            } finally {
                setGeneratingState(false);
                abortController = null;
            }
        }

        // --- 设置弹窗控制 ---
        function createNewConversation() {
            const session = createSession();
            workspace.sessions.push(session);
            workspace.activeSessionId = session.id;
            saveWorkspace();
            renderActiveConversation();
            renderMemoryPanel();
            statPrompt.textContent = '0';
            statCompletion.textContent = '0';
            statTotal.textContent = '0';
        }

        function exportMemory() {
            const exportData = {
                format: 'stupidchat-memory',
                version: 1,
                exportedAt: new Date().toISOString(),
                workspace: makeStorableWorkspace()
            };
            const url = URL.createObjectURL(new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' }));
            const link = document.createElement('a');
            link.href = url;
            link.download = `stupidchat-memory-${new Date().toISOString().slice(0, 10)}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        async function importMemory(file) {
            try {
                const imported = JSON.parse(await file.text());
                const importedWorkspace = imported?.format === 'stupidchat-memory' ? imported.workspace : imported;
                if (!isWorkspace(importedWorkspace)) throw new Error('文件格式不正确');

                const importedSessions = importedWorkspace.sessions.map(sourceSession => {
                    const nodeIds = new Map();
                    (sourceSession.nodes || []).forEach(node => nodeIds.set(node.id, createId()));
                    const nodes = (sourceSession.nodes || [])
                        .filter(node => (node.role === 'user' || node.role === 'assistant') && nodeIds.has(node.id))
                        .map(node => ({
                            id: nodeIds.get(node.id),
                            parentId: nodeIds.get(node.parentId) || null,
                            role: node.role,
                            content: node.content,
                            references: Array.isArray(node.references) ? node.references : [],
                            createdAt: Number(node.createdAt) || Date.now()
                        }));
                    const session = createSession(String(sourceSession.title || '导入对话').slice(0, 80));
                    session.nodes = nodes;
                    session.activeNodeId = nodeIds.get(sourceSession.activeNodeId) || nodes.at(-1)?.id || null;
                    session.createdAt = Number(sourceSession.createdAt) || Date.now();
                    session.updatedAt = Number(sourceSession.updatedAt) || Date.now();
                    return session;
                });

                if (!importedSessions.length) throw new Error('文件中没有可导入的对话');
                workspace.sessions.push(...importedSessions);
                workspace.activeSessionId = importedSessions.at(-1).id;
                saveWorkspace();
                renderActiveConversation();
                renderMemoryPanel();
            } catch (error) {
                alert(`导入失败：${error.message}`);
            } finally {
                importMemoryInput.value = '';
            }
        }

        function openSettingsModal() {
            settingUrl.value = config.baseUrl || '';
            settingKey.value = config.apiKey || '';
            settingModel.value = config.model || '';
            settingSystem.value = config.systemPrompt || '';
            settingTemp.value = config.temperature !== undefined ? config.temperature : 0.7;
            tempValue.textContent = settingTemp.value;
            settingsModal.classList.remove('hidden');
        }

        openSettingsBtn.addEventListener('click', openSettingsModal);
        closeSettingsBtn.addEventListener('click', () => settingsModal.classList.add('hidden'));

        settingTemp.addEventListener('input', (e) => {
            tempValue.textContent = e.target.value;
        });

        saveSettingsBtn.addEventListener('click', () => {
            const url = settingUrl.value.trim().replace(/\/+$/, "");
            const model = settingModel.value.trim();

            if (!url || !model) {
                alert('请至少填写 API Base URL 与模型名称！');
                return;
            }

            config.baseUrl = url;
            config.apiKey = settingKey.value.trim();
            config.model = model;
            config.systemPrompt = settingSystem.value.trim();
            config.temperature = parseFloat(settingTemp.value);

            localStorage.setItem(STORAGE_KEY_CONFIG, JSON.stringify(config));
            updateBadges();
            settingsModal.classList.add('hidden');
        });

        function setGeneratingState(isGenerating) {
            sendBtn.disabled = isGenerating;
            userInput.disabled = isGenerating;
            uploadTriggerBtn.disabled = isGenerating;
            if (isGenerating) {
                stopBtn.classList.remove('hidden');
                sendBtn.classList.add('hidden');
            } else {
                stopBtn.classList.add('hidden');
                sendBtn.classList.remove('hidden');
                userInput.focus();
            }
        }

        function setupTextarea() {
            userInput.addEventListener('input', () => adjustTextarea(userInput));
            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (!sendBtn.disabled) handleSend();
                }
            });
        }

        function adjustTextarea(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 160) + 'px';
        }

        sendBtn.addEventListener('click', handleSend);
        stopBtn.addEventListener('click', () => {
            if (abortController) abortController.abort();
        });

        newChatBtn.addEventListener('click', createNewConversation);
        memoryPanelBtn.addEventListener('click', () => {
            memoryPanel.classList.remove('hidden');
            memoryPanel.classList.add('flex');
        });
        closeMemoryPanelBtn.addEventListener('click', () => {
            memoryPanel.classList.add('hidden');
            memoryPanel.classList.remove('flex');
        });
        exportMemoryBtn.addEventListener('click', exportMemory);
        importMemoryBtn.addEventListener('click', () => importMemoryInput.click());
        importMemoryInput.addEventListener('change', () => {
            if (importMemoryInput.files[0]) importMemory(importMemoryInput.files[0]);
        });

        clearBtn.addEventListener('click', () => {
            const session = getActiveSession();
            if (confirm(`确认删除“${session.title}”？`)) {
                workspace.sessions = workspace.sessions.filter(item => item.id !== session.id);
                if (!workspace.sessions.length) workspace.sessions.push(createSession());
                workspace.activeSessionId = workspace.sessions[0].id;
                saveWorkspace();
                renderActiveConversation();
                renderMemoryPanel();
                statPrompt.textContent = "0";
                statCompletion.textContent = "0";
                statTotal.textContent = "0";
            }
        });

        init();
    </script>
</body>
